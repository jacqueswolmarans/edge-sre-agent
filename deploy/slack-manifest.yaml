display_information:
  name: SRE Agent
  description: Read-only incident triage for your clusters
features:
  bot_user:
    display_name: sre
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot: [app_mentions:read, chat:write, channels:history, groups:history, im:history]
settings:
  event_subscriptions:
    bot_events: [app_mention, message.im]
  socket_mode_enabled: true
