apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-sre-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-sre-agent-read
rules:
  - apiGroups: [""]
    resources: [nodes, pods, pods/log, events]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: edge-sre-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edge-sre-agent-read
subjects:
  - kind: ServiceAccount
    name: edge-sre-agent
    namespace: default
