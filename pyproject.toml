[project]
name = "edge-sre-agent"
version = "0.1.0"
description = "Read-only incident triage agent for Kubernetes fleets. Ask in Slack, it checks Prometheus, Loki and the cluster."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "openai>=1.40",
    "slack-bolt>=1.20",
    "kubernetes>=30.1",
]

[project.scripts]
edge-sre-agent = "edge_sre_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
