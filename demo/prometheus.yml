global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  - job_name: node
    static_configs: [{ targets: ["node-exporter:9100"], labels: { site: hq } }]
  # A remote site that has gone quiet.
  - job_name: edge-site-07
    static_configs: [{ targets: ["site-07.invalid:9100"], labels: { site: site-07 } }]
